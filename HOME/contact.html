<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="201818.png">
    <title>Contact | Student HUB</title>
</head>
<body>

    <!-- ===== NAVBAR: same on every page ===== -->
    <nav class="navbar navbar-expand-lg navbar-dark site-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="201818.png" alt="Student HUB logo" class="logo">
                Student HUB
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#mainNav" aria-controls="mainNav"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="clubs.html">Clubs</a></li>
                    <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ===== PAGE CONTENT ===== -->
    <div class="container py-4">

        <h2 class="text-center mb-2">Contact Us</h2>
        <p class="text-center mb-4">Have a question? Send us a message using the form below.</p>

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <!-- Bootstrap alert -->
                <div class="alert alert-secondary text-start shadow-sm" role="alert">
                    <strong>Note:</strong> this form is for practice — it does not send messages yet.
                </div>

                <!-- Bootstrap card holding the form -->
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <form>
                            <div class="mb-3">
                                <label for="name" class="form-label">Your Name:</label>
                                <input type="text" id="name" class="form-control" placeholder="e.g. Sara Ahmed">
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Your Email:</label>
                                <input type="email" id="email" class="form-control" placeholder="e.g. sara@example.com">
                            </div>

                            <div class="mb-3">
                                <label for="message" class="form-label">Your Message:</label>
                                <textarea id="message" class="form-control" rows="4" placeholder="Write your message here..."></textarea>
                            </div>

                            <button type="submit" class="btn btn-warning">Send</button>
                        </form>
                    </div>
                </div>

                <p class="text-center mt-4">
                    Or email us directly: <b>hello@studenthub.com</b>
                </p>
            </div>
        </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer class="py-4 mt-5 border-top border-secondary">
        <p class="mb-0 text-center">&copy; 2026 Student HUB. All rights reserved.</p>
    </footer>

    <!-- Bootstrap JavaScript (needed for the mobile menu) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
