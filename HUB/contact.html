<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contact | Student HUB</title>
</head>
<body>

    <!-- ===== HEADER: same on every page ===== -->
    <header>
        <h1>🎓 Student HUB</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="clubs.html">Clubs</a>
            <a href="events.html">Events</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main>
        <h2>Contact Us</h2>
        <p>Have a question? Send us a message using the form below.</p>

        <!-- NOTE: this form does not really send messages yet.
             Sending needs a server (PHP, etc.) — for now it is just for learning. -->
        <form>
            <label>Your Name:</label>
            <input type="text" placeholder="e.g. Sara Ahmed" />

            <label>Your Email:</label>
            <input type="email" placeholder="e.g. sara@example.com" />

            <label>Your Message:</label>
            <textarea placeholder="Write your message here..."></textarea>

            <button type="submit">Send</button>
        </form>

        <p>
            Or email us directly: <b>hello@studenthub.com</b>
        </p>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer>
        <p>&copy; 2026 Student HUB. All rights reserved.</p>
    </footer>

</body>
