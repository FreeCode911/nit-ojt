# ============================================================
# Deploy the site to InfinityFree every time you push to GitHub
#
# Setup (one time):
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     FTP_USERNAME = if0_38584182
#     FTP_PASSWORD = (your FTP password)
#   Secrets are encrypted and never shown in the code or in logs.
# ============================================================

name: Deploy to InfinityFree

on:
  push:
    branches: ["main"]      # every push to main = deploy
  workflow_dispatch:        # "Run workflow" button = manual deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Get a clean copy of the repository
      - name: Get the code
        uses: actions/checkout@v4

      # 2. Put the commit number after every css/js link (?v=abc1234).
      #    Browsers cache files for 30 days, so without this they would keep
      #    showing the OLD site after a deploy. This runs on the copy that is
      #    uploaded only - your own files on the computer stay untouched.
      - name: Add version number to links (stops old caching)
        run: |
          V=$(git rev-parse --short HEAD)
          for f in index.html GAME/index.html HUB/index.html; do
            if [ -f "$f" ]; then
              sed -i -E 's/(href|src)="([^":]*\.(css|js))"/\1="\2?v='"$V"'"/g' "$f"
              echo "--- $f"
              grep -oE '(href|src)="[^"]+\.(css|js)[^"]*"' "$f"
            fi
          done

      # 3. Upload the files to the InfinityFree web folder for nit.gt.tc
      - name: Upload site to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftpupload.net
          port: 21
          protocol: ftp
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # (an empty folder next to the WordPress /htdocs of legendyt4k.ct.ws)
          server-dir: /nit.gt.tc/htdocs/
          # exclude list must be NEWLINE separated (one glob per line)
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.vscode/**
            **/node_modules/**
            **/ME/PHP/vendor/**
          # keep files on the server that are not in the repo
          dangerous-clean-slate: false
          # IMPORTANT: this value is in MILLISECONDS (60000 = 60 seconds)
          timeout: 60000
          log-level: standard
