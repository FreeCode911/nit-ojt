<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="library.css">
    <title>LIBIN Code Library</title>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="top">
        <h1>&#128193; LIBIN Code Library</h1>
        <p>Click a file on the left, then press <b>Copy</b> and paste it anywhere with Ctrl + V.</p>
    </header>

    <!-- ===== MAIN: file list + code viewer ===== -->
    <main class="layout">

        <!-- File list (filled by library.js) -->
        <aside class="sidebar">
            <h2>Files <span id="fileCount"></span></h2>
            <ul id="fileList"></ul>
        </aside>

        <!-- Code viewer -->
        <section class="viewer">
            <div class="viewer-head">
                <span id="fileName" class="file-name">index.html</span>
                <span id="fileInfo" class="file-info"></span>
                <button id="copyBtn" class="copy-btn" type="button">Copy</button>
            </div>
            <pre class="code-box"><code id="code">Loading...</code></pre>
        </section>

    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="foot">
        <p>All files come from the ME folder. Open any file to see and copy its code.</p>
    </footer>

    <!-- snippets.js holds the code of every file, library.js does the work -->
    <script src="snippets.js"></script>
    <script src="library.js"></script>
</body>
</html>
