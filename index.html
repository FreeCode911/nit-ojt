<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ===== Always send visitors to the real site ===== -->
    <script>
        (function () {
            // you are working on the files yourself -> never redirect
            var developing = location.protocol === 'file:' ||        // double-clicked index.html
                location.hostname === 'localhost' ||                // local test server
                location.hostname === '127.0.0.1';

            // anywhere else on the internet -> go to the real site
            if (!developing && location.hostname !== 'nit.gt.tc') {
                location.replace('http://nit.gt.tc/');              // replace = no "Back" entry
            }
        })();
    </script>

    <link rel="stylesheet" href="library.css">
    <title>LIBIN Code Library</title>
</head>
<body>

    <!-- ===== Background effects (just decoration) ===== -->
    <div class="bg-fx" aria-hidden="true">
        <span class="glow glow-a"></span>
        <span class="glow glow-b"></span>
        <span class="glow glow-c"></span>
    </div>

    <!-- ===== MAIN: file list + code viewer ===== -->
    <main class="layout">

        <!-- File list (filled by library.js) -->
        <aside class="sidebar">
            <h2>Files <span id="fileCount"></span></h2>

            <!-- folder tabs: one per folder inside ME (ME = the folder itself) -->
            <div id="tabBar" class="tab-bar"></div>

            <!-- search box: filters the list while you type -->
            <input id="searchBox" class="search-box" type="search"
                   placeholder="&#128269; Search files..." autocomplete="off" aria-label="Search files">

            <ul id="fileList"></ul>
            <!-- page buttons, only shown when files overflow -->
            <div id="pageBar" class="page-bar"></div>
        </aside>

        <!-- Code viewer -->
        <section class="viewer">
            <div class="viewer-head">
                <span id="fileType" class="type-badge ext-html">html</span>
                <span id="fileName" class="file-name">index.html</span>
                <span id="fileInfo" class="file-info"></span>
                <button id="previewBtn" class="preview-btn" type="button">Preview</button>
                <button id="downloadBtn" class="download-btn" type="button">Download</button>
                <button id="copyBtn" class="copy-btn" type="button">Copy</button>
            </div>

            <!-- Live preview (shown by the Preview button) -->
            <div id="previewPane" class="preview-pane" hidden>
                <div class="preview-bar">Live preview &mdash; how this file looks</div>
                <iframe id="previewFrame" title="Live preview"></iframe>
            </div>

            <pre id="codeBox" class="code-box"><code id="code">Loading...</code></pre>
        </section>

    </main>

    <!-- snippets.js holds the code of every file, library.js does the work -->
    <script src="snippets.js"></script>
    <script src="library.js"></script>
</body>
</html>
